apiVersion: v1
kind: Secret
metadata:
  name: book-catalog-secret
  labels:
    app.kubernetes.io/name: book-catalog
type: Opaque
stringData:
  # Ganti seluruh nilai contoh melalui secret manager/CI sebelum deploy ke production.
  CATALOG_API_TOKEN: "change-me-before-production"
  DATABASE_USERNAME: "catalog_app"
  DATABASE_PASSWORD: "change-this-db-password"
  JWT_SECRET: "change-this-jwt-signing-secret"
